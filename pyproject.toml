[project]
name = "zakonexpert-bot"
version = "0.1.0"
description = "Telegram bot for automated legal contract generation for TOO ZakonExpert"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy[asyncio]>=2.0.36,<3.0",
    "alembic>=1.14,<2.0",
    "asyncpg>=0.30,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "redis>=5.2,<6.0",
    "openai>=1.55,<2.0",
    "python-docx>=1.1.2,<2.0",
    "docxtpl>=0.19,<1.0",
    "pypdf>=5.1,<6.0",
    "reportlab>=4.2,<5.0",
    "Pillow>=11.0,<12.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-multipart>=0.0.12,<1.0",
    "jinja2>=3.1,<4.0",
    "structlog>=24.4,<25.0",
    "rq>=2.1,<3.0",
    "cryptography>=43.0,<44.0",
    "pytz>=2024.2",
    "num2words>=0.5.13,<1.0",
    "pymupdf>=1.24,<2.0",
    "python-magic-bin>=0.4.14; platform_system=='Windows'",
    "python-magic>=0.4.27; platform_system!='Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<7.0",
    "aiosqlite>=0.20,<1.0",
    "fakeredis>=2.26,<3.0",
    "ruff>=0.8,<1.0",
    "mypy>=1.13,<2.0",
    "types-pytz",
    "httpx>=0.27,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions", ".venv", "storage"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008"]  # B008: Depends(...) in defaults is the standard FastAPI pattern

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["alembic/versions", "tests"]

[[tool.mypy.overrides]]
# aiogram's stubs mark Message/CallbackQuery attributes (from_user, document, message, text...)
# as Optional to cover every possible Telegram update shape, but the filters each handler is
# registered under (F.document, specific states, command filters) guarantee they are present
# in practice. Chasing every union-attr here would mean sprinkling asserts across every
# handler for a case that cannot occur given the routing; the real invariants are enforced by
# aiogram's filter system, not by mypy in this module.
module = "app.bot.*"
disable_error_code = ["union-attr", "arg-type", "index"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
