name: CRM contract bridge

on:
  pull_request:
    paths:
      - 'app/api/routes/crm_bridge.py'
      - 'app/api/main.py'
      - 'app/core/config.py'
      - 'app/services/contract_import_service.py'
      - 'app/services/contract_service.py'
      - 'app/services/crm_sync_service.py'
      - 'tests/test_contract_import_service.py'
      - 'tests/test_crm_sync_service.py'
      - '.github/workflows/crm-contract-sync.yml'
  push:
    branches:
      - feature/crm-contract-sync

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -U pip
      - run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check app/api/routes/crm_bridge.py app/core/config.py app/services/contract_import_service.py app/services/contract_service.py app/services/crm_sync_service.py tests/test_contract_import_service.py tests/test_crm_sync_service.py
      - name: Tests
        run: pytest -q tests/test_contract_import_service.py tests/test_crm_sync_service.py
